<!DOCTYPE html>
<html>
    <head>
        <title>SKALA 회원가입</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <div class="container">
        <h1> 👤 회원가입</h1>
        <p>SKLALA-FRONT 회원가입을 환영합니다</p>
        <hr>
        <form>
            <fieldset>
                <legend>계정정보</legend>
                <p>
                    <label for="userId">아이디: </label>
                    <input for="userId" name="userId" minlength="4" maxlength="15" required placeholder="4~15자 영문/숫자"></input>
                    <small>(필수)</small>
                </p>
                <p>
                    <label for="userPw">비밀번호: </label>
                    <input for="userPw" name="userPw" minlength="4" maxlength="15" required placeholder="8자 이상 입력"></input>
                    <small>(필수)</small>
                </p>
                <p>
                    <label for="userEmail">이메일:</label>
                    <input for="userEmail" name="userEmail" placeholder="example"></input>
                    @
                    <select name="emailDomain">
                        <option value="direct">직접 입력</option>
                        <option value="naver.com">naver.com</option>
                        <option value="gmail.com">gmail.com</option>
                        <option value="daum.net">daum.net</option>
                    </select>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>개인 프로필 정보</legend>
                <p>
                    <label for="userName">이름: </label>
                    <input for="userName" name="userName"></input>
                </p>
                <p>
                    <label for="userBirth">생년월일: </label>
                    <input type="date" id="userBirth" name="userBirth"></input>
                </p>
                <p>
                    성별:
                    <label><input type="radio" name="gender" value="male"> 남성 </label>
                    <label><input type="radio" name="gender" value="female"> 여성 </label>
                    <label><input type="radio" name="gender" value="none"> 선택안함 </label>
                </p>
                <p>
                    관심분야 (중복 선택 가능): <br>
                    <br>
                    <label><input type="checkbox" name="interest" id="frontend">웹 프론트엔드 (Vue.js/HTML)</label><br>
                    <label><input type="checkbox" name="interest" id="uiux">UI/UX 디자인 표준</label><br>
                    <label><input type="checkbox" name="interest" id="backend">백엔드 & 데이터베이스</label><br>
                    <label><input type="checkbox" name="interest" id="devops">클라우드 & 인프라</label>
                </p>
                <p>
                    <label for="userWay">가입경로:</label>
                    <select name="emailDomain">
                        <option value="direct">--선택해주세요--</option>
                        <option value="Blog">블로그</option>
                        <option value="Insta">인스타그램</option>
                        <option value="Facebook">페이스북</option>
                    </select>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>자기소개</legend>
                <p>
                    <label for="intro">나를 표현하는 한줄 소개 또는 가입 인사:</label><br>
                    <textarea name="intro" id="intro" rows="5" cols="50" placeholder="여기에 내용을 입력해주세요(최대 200자)"></textarea>
                </p>
            </fieldset>
            <br>
            <a href="http://127.0.0.1:5500/html/signUpResult.html">
                <input type="button" value="동의하고 회원가입">
            </a>
            <input type="reset" value="다시 작성">
        </form>
        </div>
    </body>
</html>
